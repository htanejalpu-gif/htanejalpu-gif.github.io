<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Play TV</title>
  
  <!-- PWA & iOS Mobile Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Play TV">
  <meta name="theme-color" content="#0D1B3E">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.json">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Drag bar for macOS window -->
  <div class="window-titlebar"></div>

  <!-- Header -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">PLAY TV</span>
        <span class="brand-badge">PWA HD</span>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Search 125 channels... (Press / to search)" autocomplete="off" spellcheck="false">
      <button id="clearSearchBtn" class="clear-search-btn" title="Clear search">✕</button>
    </div>

    <!-- Stats & Actions -->
    <div class="header-actions">
      <div class="channel-counter" id="channelCounter">125 Channels</div>
      <button id="refreshBtn" class="icon-btn" title="Reload channels">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Category Filter Bar -->
  <nav class="categories-bar" id="categoriesBar">
    <!-- Category pills generated dynamically -->
  </nav>

  <!-- Pakistan Subcategories Bar (shown when Pakistan or All selected) -->
  <div class="subcategories-bar" id="subcategoriesBar" style="display: none;">
    <!-- Subcategory pills generated dynamically -->
  </div>

  <!-- Main Channels Grid Container -->
  <main class="main-content" id="mainContent">
    <div class="channels-grid" id="channelsGrid">
      <!-- Channel cards rendered dynamically -->
    </div>
    
    <!-- Empty state when no channels match search -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        <line x1="8" y1="11" x2="14" y2="11"></line>
      </svg>
      <h3>No channels found</h3>
      <p id="emptyStateText">Try a different search term or select another category</p>
      <button class="pill active" id="resetFilterBtn">View All 125 Channels</button>
    </div>
  </main>

  <!-- Fullscreen Video Player Modal Overlay -->
  <div class="player-overlay" id="playerOverlay" style="display: none;">
    <!-- Player Top Bar -->
    <div class="player-topbar" id="playerTopbar">
      <button class="back-btn" id="closePlayerBtn" title="Back to Channels (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back</span>
      </button>

      <div class="player-channel-info">
        <img id="playerChannelLogo" class="player-logo-thumb" src="" alt="">
        <div class="player-channel-meta">
          <div class="player-title-row">
            <h2 id="playerChannelName">Channel Name</h2>
            <span class="live-tag">● LIVE</span>
          </div>
          <div class="player-desc-row">
            <span id="playerChannelCat" class="cat-pill-mini">NEWS</span>
            <span id="playerChannelDesc">HD • 720p</span>
          </div>
        </div>
      </div>

      <div class="player-top-actions">
        <!-- Stream Source Switcher Pill -->
        <button id="streamSwitcherBtn" class="stream-source-btn" title="Click to switch between Primary and Backup streams">
          <span class="stream-source-dot"></span>
          <span id="streamSourceLabel">Primary Stream</span>
        </button>

        <button id="toggleDrawerBtn" class="icon-btn-player" title="Browse Channels (C)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Video Stage -->
    <div class="video-container" id="videoContainer">
      <video id="videoPlayer" playsinline autoplay></video>

      <!-- Center Loading Spinner -->
      <div class="player-loader" id="playerLoader">
        <div class="spinner"></div>
        <p id="playerLoaderText">Connecting live stream...</p>
      </div>

      <!-- Error / Fallback Alert Toast -->
      <div class="player-toast" id="playerToast" style="display: none;"></div>

      <!-- Play / Pause Center Flash Animation -->
      <div class="playback-flash" id="playbackFlash">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </div>
    </div>

    <!-- Player Bottom Controls Bar -->
    <div class="player-controls" id="playerControls">
      <div class="controls-left">
        <!-- Play / Pause Toggle -->
        <button id="playPauseBtn" class="ctrl-btn" title="Play/Pause (Space)">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
        </button>

        <!-- Volume & Mute -->
        <div class="volume-control">
          <button id="volumeBtn" class="ctrl-btn" title="Mute/Unmute (M)">
            <svg id="volHighIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg id="volMuteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1">
        </div>

        <span class="live-badge">● LIVE STREAM</span>
      </div>

      <div class="controls-right">
        <!-- Previous / Next Channel -->
        <button id="prevChannelBtn" class="ctrl-btn" title="Previous Channel (←)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="19 20 9 12 19 4 19 20"></polygon>
            <line x1="5" y1="19" x2="5" y2="5"></line>
          </svg>
        </button>
        <button id="nextChannelBtn" class="ctrl-btn" title="Next Channel (→)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19"></line>
          </svg>
        </button>

        <!-- Picture-in-Picture Button -->
        <button id="pipBtn" class="ctrl-btn" title="Picture in Picture (P)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <rect x="12" y="10" width="8" height="8" rx="1" fill="currentColor"></rect>
          </svg>
        </button>

        <!-- Fullscreen Button -->
        <button id="fullscreenBtn" class="ctrl-btn" title="Fullscreen (F)">
          <svg id="enterFsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
          <svg id="exitFsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
            <polyline points="4 14 10 14 10 20"></polyline>
            <polyline points="20 10 14 10 14 4"></polyline>
            <line x1="14" y1="10" x2="21" y2="3"></line>
            <line x1="10" y1="14" x2="3" y2="21"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Quick Channel Drawer (Right Sidebar inside player) -->
    <aside class="channel-drawer" id="channelDrawer">
      <div class="drawer-header">
        <h3>Channels</h3>
        <button id="closeDrawerBtn" class="drawer-close-btn">✕</button>
      </div>
      <div class="drawer-search">
        <input type="text" id="drawerSearchInput" placeholder="Quick search channel...">
      </div>
      <div class="drawer-list" id="drawerList">
        <!-- Drawer channel items -->
      </div>
    </aside>
  </div>

  <!-- Load HLS Engine, Channels Data & Application JS -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script src="channels_data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
